<div class="auth-wrapper">
  <div class="login-card">
    <h1>Tecno-Repuestos</h1>
    <p>Inicia sesión para gestionar el inventario</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          id="username"
          type="text" 
          name="username" 
          [(ngModel)]="user.username" 
          #usernameModel="ngModel"
          required 
          placeholder="Tu usuario">
          
        @if (usernameModel.invalid && usernameModel.touched) {
          <small class="error-text">El usuario es obligatorio</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password"
          type="password" 
          name="password" 
          [(ngModel)]="user.password" 
          #passwordModel="ngModel"
          required 
          placeholder="********">
          
        @if (passwordModel.invalid && passwordModel.touched) {
          <small class="error-text">La contraseña es obligatoria</small>
        }
      </div>    
      
      <button type="submit" [disabled]="!loginForm.valid || loading">
        @if (loading) { <span>Conectando...</span> } 
        @else { <span>Entrar</span> }
      </button>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
      </div>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
    </form>
  </div>
</div>
